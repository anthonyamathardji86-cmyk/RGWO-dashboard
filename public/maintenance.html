<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Onderhoud - RGWO Portal</title>
    <meta name="theme-color" content="#1e293b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255,255,255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        }
        .container {
            text-align: center;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 90%;
            border-radius: 24px;
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: #fef3c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon-wrapper i {
            font-size: 2rem;
            color: #f59e0b;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .check-text {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .footer img {
            width: 24px;
            height: 20px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container glass-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-wrench"></i>
        </div>
        <h1>Website Onderhoud</h1>
        <p class="subtitle">
            We voeren momenteel onderhoud uit aan het RGWO Portal.<br>
            Probeer het later opnieuw. Bedankt voor uw geduld!
        </p>
        <div class="spinner"></div>
        <p class="check-text">Controleren beschikbaarheid...</p>
        <div class="footer">
            <img src="/logo.png" alt="RGWO">
            <span>RGWO Portal &copy; <span id="year"></span></span>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Auto-check every 30s if maintenance is over
        setInterval(() => {
            fetch('/api/me', { credentials: 'include' })
                .then(res => {
                    // If we get anything other than 503, maintenance is over
                    if (res.status !== 503) {
                        window.location.reload();
                    }
                })
                .catch(() => {});
        }, 30000);
    </script>
</body>
</html>
